name: justride_ui
description: JustRide production-level Flutter UI for the ride navigation app.
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_blue_plus: ^2.3.12
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  http: ^1.6.0
  http_parser: ^4.1.2
  web_socket_channel: ^3.0.3
  shared_preferences: ^2.5.5
  smooth_page_indicator: ^1.1.0
  google_maps_flutter: ^2.18.0
  geolocator: ^14.0.3
  flutter_polyline_points: ^3.1.0
  receive_sharing_intent: ^1.9.0
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/firmware/justride_firmware.bin
    - assets/justride-device.webp
    - assets/justride-logo-horizontal.png
    - assets/brands/google-g.png
    - assets/help/app_faqs.json
